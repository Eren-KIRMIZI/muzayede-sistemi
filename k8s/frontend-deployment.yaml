---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auctionhub-frontend
  namespace: auctionhub
  labels:
    app: auctionhub-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auctionhub-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auctionhub-frontend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: ghcr.io/your-org/auctionhub-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: auctionhub-config
                  key: NEXT_PUBLIC_API_URL
            - name: NEXT_PUBLIC_WS_URL
              valueFrom:
                configMapKeyRef:
                  name: auctionhub-config
                  key: NEXT_PUBLIC_WS_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auctionhub-frontend
  namespace: auctionhub
spec:
  selector:
    app: auctionhub-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
