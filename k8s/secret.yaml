apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: auction-hub
type: Opaque
stringData:
  # NOTE: In a real environment, use SOPS or external secret management (Vault/AWS Secrets Manager)
  # Do not commit real passwords to Git.
  DATABASE_URL: "postgresql://user:pass@postgres:5432/auctionhub?schema=public"
  JWT_SECRET: "your-super-secret-jwt-key"
  STRIPE_SECRET_KEY: "sk_live_..."
  STRIPE_WEBHOOK_SECRET: "whsec_..."
  REDIS_PASSWORD: "your-redis-password"
  SMTP_USER: "postmaster@auctionhub.io"
  SMTP_PASS: "smtp-password"
