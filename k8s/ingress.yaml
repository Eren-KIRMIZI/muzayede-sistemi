---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auctionhub-ingress
  namespace: auctionhub
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "50"
    # SSL
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auctionhub.io
        - api.auctionhub.io
      secretName: auctionhub-tls
  rules:
    - host: api.auctionhub.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auctionhub-backend
                port:
                  number: 3001
    - host: auctionhub.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auctionhub-frontend
                port:
                  number: 3000
---
# ConfigMap for non-secret configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: auctionhub-config
  namespace: auctionhub
data:
  CORS_ORIGIN: "https://auctionhub.io"
  FRONTEND_URL: "https://auctionhub.io"
  NEXT_PUBLIC_API_URL: "https://api.auctionhub.io/api/v1"
  NEXT_PUBLIC_WS_URL: "https://api.auctionhub.io"
  NODE_ENV: "production"
